<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Install Jadco Screens</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:#eef3fb;background:radial-gradient(1200px 600px at 50% -10%,#0a2143 0%,#00122d 60%)}
.card{width:100%;max-width:360px;margin:24px;padding:32px 24px;text-align:center;background:#071a35;border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 22px 54px -18px rgba(0,0,0,.7)}
.icon{width:96px;height:96px;border-radius:22px;margin:0 auto 18px;display:block}
h1{font-size:22px;margin:0 0 2px;letter-spacing:.3px}.sub{color:#93a7c0;font-size:13px;margin:0 0 26px}
a.btn{display:block;text-decoration:none;font-weight:700;font-size:17px;padding:15px;border-radius:14px;color:#0a1220;background:#c2a35e}
a.btn:active{opacity:.7}.note{color:#93a7c0;font-size:12px;line-height:1.5;margin-top:22px}.step{color:#c2a35e;font-weight:600}</style>
</head><body><div class="card">
<img class="icon" src="icon.png" alt="Jadco Screens">
<h1>Jadco Screens</h1><p class="sub">Equinoxe dashboards &amp; TV remote</p>
<a class="btn" href="itms-services://?action=download-manifest&amp;url=https://sreeg05.github.io/jadco-screens/manifest.plist">Install app</a>
<p class="note">Open in <span class="step">Safari</span> on the registered iPhone, then tap <span class="step">Install app</span> &rarr; <span class="step">Install</span>.<br><br>First launch: Settings &rarr; General &rarr; VPN &amp; Device Management &rarr; trust the developer.</p>
</div></body></html>
